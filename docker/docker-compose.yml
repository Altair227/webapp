version: '3.8'

services:
  postgres:
    image: postgres:15
    env_file:
      - ../app/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crm-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  prettier:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../app:/app
    command: sh -c "npm install -g prettier && prettier --write '**/*.html **/*.css'"
    user: "${UID}:${GID}"

  mailpit:
    container_name: lms-mailpit
    image: axllent/mailpit
    networks:
      - crm-network
    ports:
      - "8025:8025"
      - "1025:1025"

  jodit-finder:
    image: w2fb/jodit-python:latest
    container_name: jodit-finder
    restart: unless-stopped
    ports:
      - "9023:9023"
    user: "1000:1000"
    environment:
      PORT: "9023"
      CONFIG_FILE: /app/config.json
    volumes:
      - ./jodit-finder.json:/app/config.json:ro
      - ../web/upload:/app/files
networks:
  crm-network:
    driver: bridge

