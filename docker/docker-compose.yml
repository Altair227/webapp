name: altair

services:
  app:
    build:
      context: ..
      dockerfile: docker/python.Dockerfile
    working_dir: /srv
    volumes:
      - ..:/srv
      - ./runtime/logs/webapp:/var/log/webapp
    env_file:
      - ../app/.env
    environment:
      HOST: 0.0.0.0
      PORT: 9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "9000:9000"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - crm-network

  postgres:
    image: postgres:15
    env_file:
      - ../app/.env
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'select 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - crm-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  prettier:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ../app:/app
      - ./runtime/cache/npm:/tmp/.npm
    environment:
      npm_config_cache: /tmp/.npm
    entrypoint: ["npx", "--yes", "prettier@3"]
    command: ["--write", "**/*.html", "**/*.css"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  node:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app/assets
    volumes:
      - ../app/assets:/app/assets
      - ./runtime/cache/npm:/tmp/.npm
    environment:
      npm_config_cache: /tmp/.npm
    entrypoint: ["npm"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  mailpit:
    image: axllent/mailpit
    networks:
      - crm-network
    ports:
      - "8026:8025"
      - "1025:1025"

  jodit-finder:
    # >= 0.6.0: needed for the root-relative baseurl in jodit-finder.json
    image: w2fb/jodit-python:0.6.0
    restart: unless-stopped
    ports:
      - "9023:9023"
    user: "1000:1000"
    environment:
      PORT: "9023"
      CONFIG_FILE: /app/config.json
    volumes:
      - ./jodit-finder.json:/app/config.json:ro
      - ../web/upload:/app/files
networks:
  crm-network:
    driver: bridge

