{% extends "client/base.html" %} {% block title %}Client News{% endblock %} {%
block content %}
<h1>Client news page</h1>
<div class="row">
  {% for item in items %}
  <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">
    <div class="card">
      {% if item.image_url %}
      <img src="{{ item.image_url }}" class="card-img-top" alt="..." />
      {% endif %}
      <div class="card-body">
        <h5 class="card-title">{{item.title}}</h5>
        <p class="card-text">{{item.description}}</p>
        <a
          href="{{ url_for('client.client_news.view', _id=item.id)}}"
          class="btn btn-primary stretched-link"
        >
          Go somewhere
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
