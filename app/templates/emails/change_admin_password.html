<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Восстановление пароля</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .btn {
        display: inline-block;
        padding: 12px 20px;
        background-color: #007bff;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 20px;
      }
      .footer {
        font-size: 12px;
        color: #888;
        margin-top: 30px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Смена пароля</h2>

      <p>Здравствуйте,ваш пароль был изменён</p>
      <p>
        Ваш логин:
        <b>{{login}}</b>
      </p>
      <p>
        Ваш новый пароль:
        <b>{{password}}</b>
      </p>
    </div>
  </body>
</html>
