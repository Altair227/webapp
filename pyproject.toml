[tool.ruff]
line-length = 79
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    ".idea",
    "alembic",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true

warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [".venv", "alembic"]
