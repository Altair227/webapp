[tool.ruff]
line-length = 79
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    ".idea",
    "alembic",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [".venv", "alembic"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
version_path_separator = "os"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s"
