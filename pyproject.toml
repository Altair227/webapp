[project]
name = "WebApp"
version = "0.1.0"
description = "This is my first webapp"
dependencies = [
    "Flask-Mail",
    "psycopg2-binary",
    "bcrypt",
    "email-validator==2.3.0",
    "Flask-WTF==1.2.2",
    "alembic==1.18.1",
    "annotated-types==0.7.0",
    "librt==0.7.8",
    "Mako==1.3.10",
    "MarkupSafe==3.0.3",
    "mypy==1.19.1",
    "mypy_extensions==1.1.0",
    "pathspec==1.0.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pydantic_core==2.41.5",
    "python-dotenv==1.2.1",
    "ruff==0.14.13",
    "SQLAlchemy==2.0.45",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.3.1",
    "sqlalchemy-utils>=0.42.1",
    "flask>=3.1.3",
    "gunicorn>=25.1.0",
]

[tool.ruff]
line-length = 79
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    ".idea",
    "alembic",
    "__pycache__"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [".venv", "alembic"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.alembic]
script_location = "migrations"
prepend_sys_path = "."
version_path_separator = "os"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s"
